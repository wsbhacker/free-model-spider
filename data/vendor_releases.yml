# 厂商大模型新鲜度统计配置（v2 spec：2026-10-30-vendor-official-crawl-redesign.md §3/§4）
# 厂商顺序 = 报告展示顺序；v2 范围 8 家（御三家 + deepseek/kimi/glm/qwen/minimax；
# 阶跃星辰用户 2026-10-30 决策移除）。
# match/exclude 为公告条目与目录条目的门筛（regex，any-of，按线独立生效）；
# 行归属歧义与文章页提取由 LLM 裁决；日期真值 = 官网公告文章页。
# 自动化 5 家：anthropic/google/deepseek/zhipu/minimax（有公告源）；
# 降级 3 家：openai/qwen/moonshot（官网无可爬公告源 → 目录审计 + override 兜底）。
# meta/xai/mistral/cohere/bytedance/tencent/stepfun 暂移出（v1 配置见 git 历史 1bc99af）。
stale_days: 45
vendors:
  - id: openai
    name: OpenAI
    official_domains: [openai.com]
    directory_slugs: { openrouter: [openai, "~openai"], modelsdev: [openai] }
    announcements:
      # 2026-10-30 探测：changelog 静态 HTML 仅含 2025 旧条目（新条目 JS 渲染）、
      # openai.com 主站 403、帮助中心 403 → 暂无可用公告源，走目录审计 + override 兜底
      []
    lines:
      - key: flagship
        name: GPT 主线
        match: ['gpt-\d']
        exclude: [mini, nano, image, video, audio, embed, transcribe, safeguard, guard]
      - key: sub
        name: GPT mini
        match: ['gpt-\d[\d.]*-?mini']
  - id: anthropic
    name: Anthropic
    official_domains: [anthropic.com]
    directory_slugs: { openrouter: [anthropic], modelsdev: [anthropic] }
    announcements:
      - { name: 新闻 sitemap, url: "https://www.anthropic.com/sitemap.xml",
          mode: sitemap, include: "/news/" }
    lines:
      - key: flagship
        name: Claude Opus
        match: ['claude-[\d.]*-?opus']
        exclude: [sonnet, haiku, image, video, audio, embed, guard, translate]
      - key: sub
        name: Claude Sonnet
        match: ['claude-[\d.]*-?sonnet']
        exclude: [haiku, image, video, audio, embed, guard, translate]
  - id: google
    name: Google DeepMind
    official_domains: [blog.google, deepmind.google, ai.google.dev]
    directory_slugs: { openrouter: [google], modelsdev: [google] }
    announcements:
      - { name: Gemini API 更新日志, url: "https://ai.google.dev/gemini-api/docs/changelog",
          mode: headings }
    lines:
      - key: flagship
        name: Gemini 主线
        match: ['gemini-\d']
        exclude: [flash, image, video, audio, embedding, guard, nano, live]
      - key: sub
        name: Gemini Flash
        match: ['gemini-\d[\d.]*-?flash']
  - id: deepseek
    name: DeepSeek
    official_domains: [deepseek.com, api-docs.deepseek.com]
    directory_slugs: { openrouter: [deepseek], modelsdev: [deepseek] }
    announcements:
      - { name: 更新日志, url: "https://api-docs.deepseek.com/updates", mode: headings }
    lines:
      - key: flagship
        name: DeepSeek V/R 主线
        match: ['deepseek-(v\d|r\d|chat|reasoner)']
        exclude: [flash, coder, vision, image, video, audio, embed, guard, translate]
      - key: sub
        name: DeepSeek Flash
        match: ['deepseek-(v[\d.]+|[\d.]+)-?flash']
        exclude: [coder, vision, image, video, audio, embed, guard, translate]
  - id: qwen
    name: 阿里 Qwen
    official_domains: [qwen.ai, qwenlm.github.io]
    directory_slugs: { openrouter: [qwen], modelsdev: [alibaba] }
    announcements:
      # 2026-10-30 探测：qwenlm.github.io/blog 已改为跳转壳（迁 qwen.ai），
      # qwen.ai 全站 SPA（robots/sitemap 均返回 HTML）→ 暂无可用公告源，走目录审计 + override 兜底
      []
    lines:
      - key: flagship
        name: Qwen Max/旗舰
        match: ['qwen-(max|plus)', 'qwen\d+(\.\d+)?', 'qwq']
        exclude: [turbo, flash, coder, vl, omni, mt, character, image, video, audio, embed, guard, translate]
      - key: sub
        name: Qwen Turbo/Flash
        match: ['qwen[\d.]*-?(turbo|flash)']
        exclude: [mt, coder, vl, omni, image, video, audio, embed, guard, translate]
  - id: moonshot
    name: 月之暗面
    official_domains: [moonshot.cn, moonshot.ai]
    directory_slugs: { openrouter: [moonshotai], modelsdev: [moonshotai] }
    announcements:
      # 2026-10-30 探测：changelog 正文日期不落 HTML（kimi/docs 迁 platform.kimi.com 后
      # 为 JS 渲染）→ 暂无可用公告源，走目录审计 + override 兜底（v2 spec §6）
      []
    lines:
      - key: flagship
        name: Kimi K 主线
        match: ['kimi-k\d']
        exclude: [flash, turbo, highspeed, image, video, audio, embed, guard, translate, vl, vision]
      - key: sub
        name: Kimi K Flash/轻量
        match: ['kimi-k\d[\d.]*-.*-?(flash|turbo|lite|mini|highspeed)']
        exclude: [image, video, audio, embed, guard, translate, vl, vision]
  - id: zhipu
    name: 智谱 AI
    official_domains: [z.ai, bigmodel.cn, zhipuai.cn]
    directory_slugs: { openrouter: [z-ai], modelsdev: [zai, zhipuai] }
    announcements:
      - { name: 发布说明, url: "https://docs.z.ai/release-notes/new-released", mode: headings }
    lines:
      - key: flagship
        name: GLM 主线
        match: ['glm-\d']
        exclude: [flash, air, embedding, voice, vision, guard]
      - key: sub
        name: GLM Flash
        match: ['glm-\d[\d.]*-?(flash|flashx)']
  - id: minimax
    name: MiniMax
    official_domains: [minimax.io, minimaxi.com]
    directory_slugs: { openrouter: [minimax], modelsdev: [minimax] }
    announcements:
      - { name: 新闻 sitemap, url: "https://minimax.io/sitemap.xml",
          mode: sitemap, include: "/(news|blog)/" }
    lines:
      - key: flagship
        name: MiniMax M 主线
        match: ['minimax-m\d']
        exclude: [flash, image, video, audio, embed, guard, translate, speech, music, vl]
      - key: sub
        name: M Flash
        match: ['minimax-m\d[\d.]*-?flash']
        exclude: [image, video, audio, embed, guard, translate, speech, music, vl]
