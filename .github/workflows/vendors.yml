name: vendor-freshness

on:
  schedule:
    # 每月单数日 23:13 UTC（北京 07:13）= 每两天一次；步进按月历取模，月末相邻两次可能只隔 1 天。
    # 晚于 daily 10 分钟，正常情况下接在其后跑
    - cron: "13 23 */2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: run=日常监测, bootstrap=生成基线草稿
        type: choice
        options: [run, bootstrap]
        default: run
      vendor:
        description: 仅 bootstrap 用的厂商 id
        required: false
        type: string

permissions:
  contents: write

# 与 daily.yml 同一个 group（仓库级生效）：两个 workflow 互斥串行，
# 一个在跑时另一个进入 pending 等待，不会同时向 main 推送
concurrency:
  group: fms-daily-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          # 默认 checkout 的是触发时刻的 SHA；排队等 daily push 完再开跑时该 SHA 已过期。
          # 显式给分支 ref，checkout 在真正执行时拉取分支最新
          ref: ${{ github.ref }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen

      - name: Configure git identity
        run: |
          git config user.name "free-model-bot"
          git config user.email "free-model-bot@users.noreply.github.com"

      - name: Run vendor freshness report
        env:
          DIFY_API_BASE: ${{ vars.DIFY_API_BASE }}
          DIFY_API_TOKEN: ${{ secrets.DIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.mode }}" = "bootstrap" ]; then
            uv run fms vendors --bootstrap --no-commit ${{ inputs.vendor && format('--vendor {0}', inputs.vendor) || '' }}
          else
            uv run fms vendors
          fi

      - name: Upload baseline draft
        # bootstrap 途中任一厂商暂态失败命令即退出 1（spec §8.2），此时已生成草稿的
        # 厂商也要留档重试；结构性失败可能尚未写任何文件，忽略 no-files
        if: ${{ always() && inputs.mode == 'bootstrap' }}
        uses: actions/upload-artifact@v6
        with:
          name: vendor-baseline-draft
          path: data/vendor-releases/
          if-no-files-found: ignore
